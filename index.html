<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dao động ký - Thực hành đo sóng âm (Có Trigger)</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #e6f7ff;
            font-family: sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        
        .controls-wrapper {
            display: flex;
            flex-wrap: wrap; 
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background-color: #f0f4f8;
            border-bottom: 3px solid #000;
            box-sizing: border-box;
            gap: 15px;
            z-index: 10;
            flex-shrink: 0; 
        }

        .btn-group {
            display: flex; 
            flex-wrap: wrap; 
            gap: 10px; 
            align-items: center;
        }

        .slider-group {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            background: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
            font-weight: bold;
        }

        .slider-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .info-panel {
            font-weight: bold;
            font-size: 15px;
            color: #d93025;
            background: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            min-width: 220px;
            text-align: center;
            flex-grow: 1; 
        }

        button {
            padding: 8px 15px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            box-shadow: 0 3px 5px rgba(0,0,0,0.2);
            transition: background-color 0.2s;
            white-space: nowrap;
        }
        button:hover { filter: brightness(0.9); }
        button:disabled {
            background-color: #999;
            cursor: not-allowed;
            box-shadow: none;
        }
        #modeButton { background-color: #6f42c1; }
        #startButton { background-color: #007bff; }
        #pauseButton { background-color: #28a745; }
        #triggerButton { background-color: #20c997; } 
        #resetButton { background-color: #fd7e14; }
        #saveButton { background-color: #17a2b8; }
        #fullscreenButton { background-color: #6c757d; }

        canvas {
            flex-grow: 1;
            width: 100%;
            min-height: 400px; 
            display: block;
        }
    </style>
</head>
<body>
    <div class="controls-wrapper">
        <div class="btn-group">
            <button id="modeButton">Chế độ: 1 Nguồn</button>
            <button id="startButton">1. Bật Micro</button>
            <button id="pauseButton" disabled>2. Đo / Dừng</button>
            <button id="triggerButton">3. Trigger: BẬT</button>
            <button id="resetButton" disabled>4. Làm mới</button>
            <button id="saveButton" disabled>5. Chụp ảnh</button>
            <button id="fullscreenButton">6. Toàn màn hình</button>
        </div>
        
        <div class="slider-group">
            <label>
                Trục Y (Biên độ): 
                <input type="range" id="zoomY" min="0.5" max="5.0" step="0.1" value="2.0">
            </label>
            <label>
                Trục X (Thời gian): 
                <input type="range" id="zoomX" min="0.2" max="3.0" step="0.1" value="1.0">
            </label>
        </div>

        <div class="info-panel" id="infoText">Trạng thái: Đang chờ bật Micro...</div>
    </div>

    <canvas id="oscilloscope"></canvas>

    <script>
        const modeButton = document.getElementById('modeButton');
        const startButton = document.getElementById('startButton');
        const pauseButton = document.getElementById('pauseButton');
        const triggerButton = document.getElementById('triggerButton');
        const resetButton = document.getElementById('resetButton');
        const saveButton = document.getElementById('saveButton');
        const fullscreenButton = document.getElementById('fullscreenButton');
        const infoText = document.getElementById('infoText');
        const zoomYSlider = document.getElementById('zoomY');
        const zoomXSlider = document.getElementById('zoomX');
        const canvas = document.getElementById('oscilloscope');
        const canvasCtx = canvas.getContext('2d');
        
        let audioCtx, analyser;
        let isDualMode = false; 
        let isPaused = true; 
        let useTrigger = true; 
        let sampleRate = 48000; 
        let stopTimer; 

        let detectedFrequency = 0; 
        let freq1 = 0; 
        let freq2 = 0; 
        let savedData1 = null; 
        let savedData2 = null; 
        let currentMeasuringStep = 1; 
        
        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
            drawFrame(true); 
        }
        window.addEventListener('resize', resizeCanvas);

        modeButton.addEventListener('click', () => {
            isDualMode = !isDualMode;
            modeButton.textContent = isDualMode ? "Chế độ: 2 Nguồn (Lần lượt)" : "Chế độ: 1 Nguồn";
            
            isPaused = true;
            clearTimeout(stopTimer);
            pauseButton.textContent = "2. Đo / Dừng";
            pauseButton.style.backgroundColor = "#28a745";
            
            detectedFrequency = 0;
            freq1 = 0;
            freq2 = 0;
            savedData1 = null;
            savedData2 = null;
            currentMeasuringStep = 1;
            
            if (!startButton.disabled) {
                infoText.textContent = "Trạng thái: Đang chờ bật Micro...";
                infoText.style.color = "#d93025";
            } else {
                if (isDualMode) {
                    infoText.textContent = "Sẵn sàng: Hãy phát Nguồn 1 và bấm Đo";
                    infoText.style.color = "#ff0000";
                } else {
                    infoText.textContent = "Trạng thái: Đã sẵn sàng";
                    infoText.style.color = "#007bff";
                }
            }
            drawFrame(true); 
        });

        triggerButton.addEventListener('click', () => {
            useTrigger = !useTrigger;
            triggerButton.textContent = useTrigger ? "3. Trigger: BẬT" : "3. Trigger: TẮT";
            triggerButton.style.backgroundColor = useTrigger ? "#20c997" : "#6c757d";
            if (isPaused) drawFrame(false);
        });

        fullscreenButton.addEventListener('click', () => {
            let elem = document.documentElement;
            let isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;

            if (!isFullscreen) {
                if (elem.requestFullscreen) elem.requestFullscreen().catch(() => {});
                else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        });

        function updateFullscreenButton() {
            let isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
            fullscreenButton.textContent = !isFullscreen ? "6. Toàn màn hình" : "6. Thu nhỏ (Thoát)";
            setTimeout(resizeCanvas, 100); 
        }
        document.addEventListener('fullscreenchange', updateFullscreenButton);
        document.addEventListener('webkitfullscreenchange', updateFullscreenButton);

        function autoCorrelate(buffer, sampleRate) {
            let SIZE = buffer.length;
            let sumSq = 0;
            for (let i = 0; i < SIZE; i++) {
                let val = (buffer[i] - 128) / 128;
                sumSq += val * val;
            }
            let rootMeanSq = Math.sqrt(sumSq / SIZE);
            if (rootMeanSq < 0.01) return -1; 

            let r1 = 0, r2 = SIZE - 1, thres = 0.2;
            for (let i = 0; i < SIZE / 2; i++) {
                if (Math.abs((buffer[i] - 128) / 128) < thres) { r1 = i; break; }
            }
            for (let i = 1; i < SIZE / 2; i++) {
                if (Math.abs((buffer[SIZE - i] - 128) / 128) < thres) { r2 = SIZE - i; break; }
            }
            buffer = buffer.slice(r1, r2);
            SIZE = buffer.length;

            let c = new Array(SIZE).fill(0);
            for (let i = 0; i < SIZE; i++) {
                for (let j = 0; j < SIZE - i; j++) {
                    let v1 = (buffer[j] - 128) / 128;
                    let v2 = (buffer[j + i] - 128) / 128;
                    c[i] += v1 * v2;
                }
            }

            let d = 0;
            while (c[d] > c[d + 1]) d++;
            let maxval = -1, maxpos = -1;
            for (let i = d; i < SIZE; i++) {
                if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
            }
            return sampleRate / maxpos;
        }

        function findTriggerOffset(buffer) {
            if (!useTrigger || !buffer) return 0;
            for (let i = 0; i < buffer.length - 1; i++) {
                if (buffer[i] <= 128 && buffer[i + 1] > 128) {
                    return i;
                }
            }
            return 0;
        }

        function triggerAutoStop() {
            clearTimeout(stopTimer);
            if (!isPaused) {
                stopTimer = setTimeout(() => {
                    if (!isPaused) {
                        isPaused = true;
                        pauseButton.textContent = "2. Đo / Dừng";
                        pauseButton.style.backgroundColor = "#28a745"; 
                        
                        if (isDualMode) {
                            if (currentMeasuringStep === 1) {
                                infoText.textContent = "Đã xong Nguồn 1. Bấm Đo để thu Nguồn 2!";
                                infoText.style.color = "#0000ff";
                                currentMeasuringStep = 2;
                                pauseButton.disabled = false;
                            } else {
                                infoText.textContent = "Đã xong 2 nguồn - So sánh tần số f1 & f2";
                                infoText.style.color = "#d93025";
                            }
                        } else {
                            infoText.textContent = "Đã dừng - Hãy xác định chu kỳ T trên đồ thị";
                            infoText.style.color = "#d93025";
                        }
                    }
                }, 2000); 
            }
        }

        startButton.addEventListener('click', async () => {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                sampleRate = audioCtx.sampleRate; 
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const source = audioCtx.createMediaStreamSource(stream);
                
                const highpassFilter = audioCtx.createBiquadFilter();
                highpassFilter.frequency.value = 80;
                highpassFilter.type = 'highpass';

                const lowpassFilter = audioCtx.createBiquadFilter();
                lowpassFilter.frequency.value = 3000;
                lowpassFilter.type = 'lowpass';

                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 8192; 
                
                source.connect(highpassFilter);
                highpassFilter.connect(lowpassFilter);
                lowpassFilter.connect(analyser);

                isPaused = true;
                resizeCanvas();
                drawFrame(); 
                
                startButton.textContent = "Đã kết nối Micro";
                startButton.disabled = true;
                pauseButton.disabled = false;
                resetButton.disabled = false;
                saveButton.disabled = false;
                
                if (isDualMode) {
                    infoText.textContent = "Sẵn sàng: Hãy phát Nguồn 1 và bấm Đo";
                    infoText.style.color = "#ff0000";
                } else {
                    infoText.textContent = "Trạng thái: Đã sẵn sàng";
                    infoText.style.color = "#007bff";
                }
            } catch (err) {
                alert("Không thể truy cập micro. Lỗi: " + err);
            }
        });

        pauseButton.addEventListener('click', () => {
            if (isPaused) {
                isPaused = false;
                pauseButton.textContent = "Đang đo...";
                pauseButton.style.backgroundColor = "#dc3545"; 
                
                if (isDualMode) {
                    if (currentMeasuringStep === 1) infoText.textContent = "Đang ghi Nguồn 1 (Màu Đỏ)...";
                    else infoText.textContent = "Đang ghi Nguồn 2 (Màu Xanh)...";
                } else {
                    infoText.textContent = "Trạng thái: Đang ghi sóng âm...";
                }
                infoText.style.color = "#dc3545";
                
                draw(); 
                triggerAutoStop(); 
            } else {
                isPaused = true;
                clearTimeout(stopTimer); 
                pauseButton.textContent = "2. Đo / Dừng";
                pauseButton.style.backgroundColor = "#28a745"; 
                
                if (isDualMode && currentMeasuringStep === 1) {
                    infoText.textContent = "Đã xong Nguồn 1. Bấm Đo để thu Nguồn 2!";
                    infoText.style.color = "#0000ff";
                    currentMeasuringStep = 2;
                } else {
                    infoText.textContent = "Đã dừng - Hãy xác định chu kỳ T trên đồ thị";
                    infoText.style.color = "#d93025";
                }
            }
        });

        resetButton.addEventListener('click', () => {
            isPaused = true;
            clearTimeout(stopTimer); 
            pauseButton.textContent = "2. Đo / Dừng";
            pauseButton.style.backgroundColor = "#28a745"; 
            
            detectedFrequency = 0;
            freq1 = 0;
            freq2 = 0;
            savedData1 = null;
            savedData2 = null;
            currentMeasuringStep = 1;

            if (isDualMode) {
                infoText.textContent = "Đã làm mới: Hãy phát Nguồn 1 và bấm Đo";
                infoText.style.color = "#ff0000";
            } else {
                infoText.textContent = "Trạng thái: Đã sẵn sàng";
                infoText.style.color = "#007bff";
            }
            drawFrame(true);
        });

        saveButton.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `DoThi_Oscilloscope.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        zoomXSlider.addEventListener('input', () => { if(isPaused) drawFrame(); });
        zoomYSlider.addEventListener('input', () => { if(isPaused) drawFrame(); });

        function drawFrame(isReset = false) {
            if (!analyser) {
                canvasCtx.fillStyle = '#e6f7ff'; 
                canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
                return;
            }
            
            const bufferLength = analyser.frequencyBinCount; 
            const dataArray = new Uint8Array(bufferLength);
            
            if (!isPaused && !isReset) {
                analyser.getByteTimeDomainData(dataArray);
                let freq = autoCorrelate(dataArray, sampleRate);
                if (freq > 50 && freq < 2000) {
                    detectedFrequency = freq;
                    if (!isDualMode) {
                        freq1 = freq;
                    } else {
                        if (currentMeasuringStep === 1) freq1 = freq;
                        if (currentMeasuringStep === 2) freq2 = freq;
                    }
                }

                if (isDualMode) {
                    if (currentMeasuringStep === 1) savedData1 = new Uint8Array(dataArray);
                    else if (currentMeasuringStep === 2) savedData2 = new Uint8Array(dataArray);
                }
            }

            const zoomY = parseFloat(zoomYSlider.value);
            const zoomX = parseFloat(zoomXSlider.value);

            let freqForCalc = 440;
            if (freq1 > 0) freqForCalc = freq1;
            else if (detectedFrequency > 0 && !isReset) freqForCalc = detectedFrequency;

            let period = 1.0 / freqForCalc;
            let totalTimeOnScreen = 5 * period * zoomX; 

            // 1. Vẽ nền và lưới trước tiên
            canvasCtx.fillStyle = '#e6f7ff'; 
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

            canvasCtx.strokeStyle = '#b3e0ff'; 
            canvasCtx.lineWidth = 1;
            const stepX = canvas.width / 10;  
            const stepY = canvas.height / 8;  
            
            canvasCtx.beginPath();
            for(let i = 0; i <= 10; i++) {
                canvasCtx.moveTo(i * stepX, 0); canvasCtx.lineTo(i * stepX, canvas.height);
            }
            for(let i = 0; i <= 8; i++) {
                canvasCtx.moveTo(0, i * stepY); canvasCtx.lineTo(canvas.width, i * stepY);
            }
            canvasCtx.stroke();

            // 2. Vẽ trục tọa độ
            canvasCtx.lineWidth = 2;
            canvasCtx.strokeStyle = '#000000'; 
            canvasCtx.beginPath();
            canvasCtx.moveTo(0, canvas.height / 2); 
            canvasCtx.lineTo(canvas.width, canvas.height / 2);
            canvasCtx.moveTo(canvas.width / 2, 0);  
            canvasCtx.lineTo(canvas.width / 2, canvas.height);
            
            const tickSize = 5; 
            for(let i = 0; i <= 10; i++) {
                canvasCtx.moveTo(i * stepX, canvas.height / 2 - tickSize);
                canvasCtx.lineTo(i * stepX, canvas.height / 2 + tickSize);
            }
            for(let i = 0; i <= 8; i++) {
                canvasCtx.moveTo(canvas.width / 2 - tickSize, i * stepY);
                canvasCtx.lineTo(canvas.width / 2 + tickSize, i * stepY);
            }
            canvasCtx.stroke();

            // 3. VẼ ĐƯỜNG SÓNG ÂM (Tránh đè lên chữ ở bước sau)
            if (!isReset) {
                const samplesNeeded = Math.floor(totalTimeOnScreen * sampleRate);
                const sliceWidth = canvas.width / samplesNeeded;

                if (!isDualMode) {
                    let activeData = !isPaused ? dataArray : (savedData1 || dataArray);
                    if (activeData[0] !== 0) {
                        let offset = findTriggerOffset(activeData);
                        
                        canvasCtx.lineWidth = 3; 
                        canvasCtx.strokeStyle = '#ff0000'; 
                        canvasCtx.beginPath();
                        let x = 0, hasMoved = false;

                        for (let i = 0; i < samplesNeeded && (i + offset) < bufferLength; i++) {
                            const v = activeData[i + offset] / 128.0; 
                            let y = (v - 1.0) * zoomY * (canvas.height / 2) + (canvas.height / 2);
                            if (y < 0) y = 0; if (y > canvas.height) y = canvas.height;

                            if (!hasMoved) { canvasCtx.moveTo(x, y); hasMoved = true; }
                            else { canvasCtx.lineTo(x, y); }
                            x += sliceWidth;
                            if (x > canvas.width) break; 
                        }
                        canvasCtx.stroke();
                    }
                } else {
                    let drawData1 = (!isPaused && currentMeasuringStep === 1) ? dataArray : savedData1;
                    if (drawData1 && drawData1[0] !== 0) {
                        let offset1 = findTriggerOffset(drawData1);
                        
                        canvasCtx.lineWidth = 2.5; 
                        canvasCtx.strokeStyle = '#ff0000'; 
                        canvasCtx.beginPath();
                        let x = 0, hasMoved = false;
                        for (let i = 0; i < samplesNeeded && (i + offset1) < bufferLength; i++) {
                            const v = drawData1[i + offset1] / 128.0; 
                            let y = (v - 1.0) * zoomY * (canvas.height / 2) + (canvas.height / 2);
                            if (y < 0) y = 0; if (y > canvas.height) y = canvas.height;
                            if (!hasMoved) { canvasCtx.moveTo(x, y); hasMoved = true; }
                            else { canvasCtx.lineTo(x, y); }
                            x += sliceWidth;
                            if (x > canvas.width) break; 
                        }
                        canvasCtx.stroke();
                    }

                    let drawData2 = (!isPaused && currentMeasuringStep === 2) ? dataArray : savedData2;
                    if (drawData2 && drawData2[0] !== 0) {
                        let offset2 = findTriggerOffset(drawData2);
                        
                        canvasCtx.lineWidth = 2.5; 
                        canvasCtx.strokeStyle = '#0000ff'; 
                        canvasCtx.beginPath();
                        let x = 0, hasMoved = false;
                        for (let i = 0; i < samplesNeeded && (i + offset2) < bufferLength; i++) {
                            const v = drawData2[i + offset2] / 128.0; 
                            let y = (v - 1.0) * zoomY * (canvas.height / 2) + (canvas.height / 2);
                            if (y < 0) y = 0; if (y > canvas.height) y = canvas.height;
                            if (!hasMoved) { canvasCtx.moveTo(x, y); hasMoved = true; }
                            else { canvasCtx.lineTo(x, y); }
                            x += sliceWidth;
                            if (x > canvas.width) break; 
                        }
                        canvasCtx.stroke();
                    }
                }
            }

            // 4. VẼ CHỮ, SỐ TRỤC VÀ CHÚ THÍCH LÊN TRÊN CÙNG
            canvasCtx.font = 'bold 15px Arial';

            // Hàm phụ để tạo viền trắng cho chữ (chống bị vạch sóng đè mất nét)
            function drawTextWithOutline(txt, x, y, color = '#000000') {
                canvasCtx.strokeStyle = '#e6f7ff'; // Viền cùng màu nền
                canvasCtx.lineWidth = 4;
                canvasCtx.strokeText(txt, x, y); // Vẽ viền trước
                canvasCtx.fillStyle = color;
                canvasCtx.fillText(txt, x, y);   // Tô chữ đè lên viền
            }

            // Chú thích Nguồn
            if (isDualMode) {
                let txt1 = "■ Nguồn 1 (Đỏ)";
                if (freq1 > 0) txt1 += ` - f: ${Math.round(freq1)} Hz`;
                drawTextWithOutline(txt1, 15, 20, '#ff0000');

                let txt2 = "■ Nguồn 2 (Xanh)";
                if (freq2 > 0) txt2 += ` - f: ${Math.round(freq2)} Hz`;
                drawTextWithOutline(txt2, 230, 20, '#0000ff');
            } else {
                drawTextWithOutline("■ Sóng âm (Đỏ)", 15, 20, '#ff0000');
            }

            // Ghi số liệu lên Trục X
            canvasCtx.textAlign = 'center';
            canvasCtx.textBaseline = 'top';
            let timePerGrid = totalTimeOnScreen / 10;
            for(let i = 0; i <= 10; i++) {
                if (i !== 5) { 
                    let t_val = parseFloat(((i - 5) * timePerGrid).toFixed(4));
                    let t_str = (t_val * 1000).toFixed(1).replace('.', ','); 
                    drawTextWithOutline(t_str, i * stepX, canvas.height / 2 + 10);
                }
            }
            canvasCtx.textAlign = 'right';
            drawTextWithOutline("t (ms)", canvas.width - 10, canvas.height / 2 - 25);
            
            // Ghi số liệu lên Trục Y
            canvasCtx.textAlign = 'left';
            canvasCtx.textBaseline = 'middle';
            const maxY = 1.0 / zoomY; 
            const valPerStep = (maxY * 2) / 8; 
            for(let i = 0; i <= 8; i++) {
                if (i !== 4) { 
                    let val = maxY - (i * valPerStep);
                    let val_str = parseFloat(val.toFixed(2)).toString().replace('.', ',');
                    drawTextWithOutline(val_str, canvas.width / 2 + 10, i * stepY);
                }
            }
            drawTextWithOutline("0", canvas.width / 2 + 8, canvas.height / 2 + 15); 
            canvasCtx.textBaseline = 'top';
            drawTextWithOutline("Biên độ", canvas.width / 2 + 10, isDualMode ? 40 : 40);
        }

        function draw() {
            if (isPaused) return; 
            requestAnimationFrame(draw);
            drawFrame();
        }
    </script>
</body>
</html>
