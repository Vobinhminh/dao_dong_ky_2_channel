<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-512.png">
    <link rel="apple-touch-icon" href="icon-512.png">
    <meta name="theme-color" content="#f97316">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>FOX_LAB - Phòng thí nghiệm Vật lý về sóng cơ học</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true,
                processEnvironments: true,
                packages: ['base', 'ams', 'noerrors', 'noundefined']
            },
            options: {
                ignoreHtmlClass: 'tex2jax_ignore',
                processHtmlClass: 'tex2jax_process|fox-msg-bubble|hud-overlay'
            },
            chtml: {
                scale: 1.05,
                displayAlign: 'left'
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        @keyframes animUI-fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes animUI-slideDown { from { opacity: 0; transform: translateY(-8px) scaleY(0.95); } to { opacity: 1; transform: none; } }
        @keyframes statusPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.85); } }
        @keyframes foxPulsePing { 0% { transform: scale(0.95); opacity: 0.8; } 70%, 100% { transform: scale(1.65); opacity: 0; } }
        @keyframes foxMsgFadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; height: 100dvh;
            background-color: #f1f5f9; font-family: 'Be Vietnam Pro', 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased; overflow: hidden; position: fixed;
            display: flex; flex-direction: column;
        }

        button, input, select { font-family: inherit; outline: none; }

        .top-bar {
            display: flex; background: linear-gradient(180deg, #ffffff, #f8fafc);
            border-bottom: 2px solid #cbd5e1; z-index: 10; padding: 4px 6px; gap: 6px;
            align-items: stretch; flex-shrink: 0; box-shadow: 0 4px 10px -2px rgba(0, 0, 0, 0.05);
        }

        .controls-wrapper { display: flex; flex-direction: column; flex-grow: 1; gap: 4px; }
        .toolbar-row { display: flex; flex-wrap: wrap; gap: 4px; width: 100%; align-items: stretch; position: relative; z-index: 100; }
        .toolbar-row > * { flex: 1 1 auto; min-width: 70px; }
        .channel-row { display: flex; flex-wrap: wrap; gap: 4px; width: 100%; position: relative; z-index: 10; }

        .channel-card {
            display: flex; flex: 1 1 180px; background: #fff; border: 1px solid #cbd5e1;
            border-radius: 4px; overflow: hidden; align-items: stretch;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02); height: 26px;
        }

        .channel-card button {
            border-radius: 0; width: 90px; font-size: 11px; flex-shrink: 0;
            text-shadow: 0 1px 1px rgba(0, 0, 0, 0.2); border: none; padding: 0 4px;
        }

        .channel-card select {
            flex-grow: 1; border: none; background: #f8fafc; color: #334155;
            padding: 0 6px; font-size: 11.5px; font-weight: 700; cursor: pointer;
            text-overflow: ellipsis; white-space: nowrap;
        }

        .channel-a-indicator { border-left: 3px solid #ef4444; }
        .channel-b-indicator { border-left: 3px solid #3b82f6; }

        .qr-panel {
            display: none; flex-direction: column; align-items: center; justify-content: center;
            background: #fff; border: 1px solid #cbd5e1; border-radius: 4px; padding: 2px;
            width: 65px; flex-shrink: 0; cursor: pointer;
        }
        .qr-panel img { width: 45px; height: 45px; }
        .qr-panel .scan-title { font-size: 8px; font-weight: 800; color: #ef4444; margin-top: 1px; }

        .info-panel {
            font-weight: 600; font-size: 11.5px; color: #dc2626; background: #fff;
            padding: 2px 6px; border-radius: 4px; border: 1px solid #e2e8f0; width: 100%;
            text-align: center; box-sizing: border-box; display: flex; align-items: center;
            justify-content: space-between; min-height: 22px; position: relative; z-index: 5;
        }

        .info-badge, .channel-tag-a, .channel-tag-b {
            display: inline-block; padding: 0 4px; margin: 0 2px; border-radius: 3px; font-weight: 700;
        }

        .info-badge { background-color: rgba(16, 185, 129, 0.1); color: #059669; border: 1px solid rgba(16, 185, 129, 0.2); }
        .channel-tag-a { color: #ef4444; background-color: rgba(239, 68, 68, 0.1); }
        .channel-tag-b { color: #3b82f6; background-color: rgba(59, 130, 246, 0.1); }

        .license-gear-btn {
            background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 11.5px;
            font-weight: 700; color: #0f172a; cursor: pointer; padding: 2px 6px;
            display: inline-flex; align-items: center; gap: 4px;
        }
        .license-gear-btn:hover { background: #e2e8f0; }

        button {
            font-size: 11.5px; font-weight: bold; cursor: pointer; color: white;
            border: 1px solid rgba(0, 0, 0, 0.1); border-radius: 4px;
            box-shadow: 0 2px 3px rgba(0, 0, 0, 0.1); padding: 4px 8px; margin: 0;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: all 0.2s ease;
        }
        button:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); }
        button:disabled { background: linear-gradient(180deg, #94a3b8, #64748b) !important; cursor: not-allowed; opacity: 0.8; }

        .btn-green { background: linear-gradient(180deg, #10b981, #059669); }
        .btn-red { background: linear-gradient(180deg, #ef4444, #dc2626); }
        .btn-orange { background: linear-gradient(180deg, #f59e0b, #d97706); color: #fff !important; border: 1px solid #b45309; }
        .btn-purple { background: linear-gradient(180deg, #8b5cf6, #7c3aed); }
        .btn-pink { background: linear-gradient(180deg, #ec4899, #db2777); }
        .btn-slate { background: linear-gradient(180deg, #64748b, #475569); color: #fff !important; border: 1px solid #334155; }
        .btn-blue { background: linear-gradient(180deg, #3b82f6, #2563eb); color: #fff !important; border: 1px solid #1d4ed8; }
        .btn-dark { background: linear-gradient(180deg, #334155, #0f172a); }

        canvas {
            flex-grow: 1; width: 100%; height: 100%; display: block;
            cursor: crosshair; touch-action: none; background-color: #f8fafc;
        }

        .settings-dropdown { position: relative; display: flex; flex: 0 1 auto; z-index: 101; }
        .settings-dropdown.open { z-index: 1000; }
        .settings-dropdown-toggle {
            padding: 4px 8px; font-size: 11.5px; font-weight: 700; color: #1e293b;
            border-radius: 4px; border: 1px solid #cbd5e1; background: linear-gradient(180deg, #ffffff, #f1f5f9);
            cursor: pointer; display: flex; align-items: center; gap: 4px;
        }
        .settings-dropdown-menu {
            display: none; position: absolute; top: calc(100% + 4px); left: 0; min-width: 250px;
            z-index: 1001; background: #0f172a; border: 1px solid #334155; border-radius: 6px;
            box-shadow: 0 16px 36px -4px rgba(0, 0, 0, 0.5); overflow: hidden;
        }
        .settings-dropdown.open .settings-dropdown-menu { display: block; animation: animUI-slideDown 0.22s ease forwards; }

        .settings-group-header {
            padding: 8px 12px; font-size: 12px; font-weight: 700; color: #f8fafc; cursor: pointer;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid #1e293b; background: #0f172a;
        }
        .settings-group.expanded > .settings-group-header { background-color: #1e293b; color: #38bdf8; }
        .group-arrow { font-size: 11px; transition: transform 0.25s ease; color: #64748b; }
        .settings-group.expanded > .settings-group-header .group-arrow { transform: rotate(90deg); color: #38bdf8; }

        .settings-group-items {
            display: none; position: relative; padding: 4px; gap: 4px;
            background: #020617; border-radius: 6px; margin: 6px 8px 8px 8px; border: 1px solid #1e293b;
        }
        .settings-group.expanded > .settings-group-items { display: flex; flex-direction: row; align-items: stretch; }
        .settings-slider-pill {
            position: absolute; top: 4px; bottom: 4px; left: 0; width: 0;
            background: linear-gradient(135deg, #3b82f6, #2563eb); border-radius: 4px;
            pointer-events: none; z-index: 1; transition: transform 0.24s ease, width 0.24s ease; opacity: 0;
        }
        .settings-item {
            flex: 1; padding: 6px 4px; font-size: 11px; color: #94a3b8; cursor: pointer;
            border-radius: 4px; text-align: center; font-weight: 600; position: relative; z-index: 2;
            background: transparent !important;
        }
        .settings-item.active { color: #ffffff; font-weight: 700; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
            background: rgba(15, 23, 42, 0.95); z-index: 100000; display: none;
            align-items: center; justify-content: center;
        }
        .modal-content {
            background: #f8fafc; width: 100vw; height: 100dvh; display: flex;
            flex-direction: column; overflow: hidden; box-sizing: border-box;
        }
        .modal-header {
            color: #fff; padding: 8px 12px; font-weight: bold; font-size: 13px;
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
        }
        .modal-controls {
            padding: 6px 8px; background: #fff; border-bottom: 1px solid #cbd5e1;
            display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
            justify-content: space-between; flex-shrink: 0;
        }
    </style>
</head>
<body>

<div class="top-bar">
    <div class="controls-wrapper">
        <select id="channelModeSelect" style="display:none">
            <option value="1" selected>1 nguồn âm</option>
            <option value="2">2 nguồn âm</option>
        </select>
        <select id="modeSelect" style="display:none">
            <option value="auto">Khảo sát tần số (Tự dừng)</option>
            <option value="continuous" selected>Khảo sát liên tục</option>
        </select>
        <select id="displayModeSelect" style="display:none">
            <option value="oscilloscope" selected>Dao động ký</option>
            <option value="dbMeter">Cường độ âm (dB)</option>
        </select>
        <select id="speedSelect" style="display:none">
            <option value="fast" selected>Nhanh</option>
            <option value="slow">Chậm</option>
        </select>

        <div class="toolbar-row">
            <div class="settings-dropdown" id="settingsDropdown">
                <div class="settings-dropdown-toggle" id="settingsToggle">
                    <span>⚙️ Cài đặt</span><span class="dropdown-arrow">▼</span>
                </div>
                <div class="settings-dropdown-menu" id="settingsMenu">
                    <div class="settings-group" id="groupChannelMode">
                        <div class="settings-group-header" data-group="channelMode"><span>Chế độ nguồn âm</span><span class="group-arrow">›</span></div>
                        <div class="settings-group-items">
                            <div class="settings-item active" data-target="channelModeSelect" data-value="1">1 Nguồn</div>
                            <div class="settings-item" data-target="channelModeSelect" data-value="2">2 Nguồn</div>
                        </div>
                    </div>
                    <div class="settings-group" id="groupDisplayMode">
                        <div class="settings-group-header" data-group="displayMode"><span>Chế độ hiển thị</span><span class="group-arrow">›</span></div>
                        <div class="settings-group-items">
                            <div class="settings-item active" data-target="displayModeSelect" data-value="oscilloscope">Dao động ký</div>
                            <div class="settings-item" data-target="displayModeSelect" data-value="dbMeter">Cường độ âm (dB)</div>
                        </div>
                    </div>
                </div>
            </div>

            <button id="pauseButton" class="btn-green" disabled>Đo / Dừng</button>
            <button id="resetButton" class="btn-orange">Làm mới</button>
            <button id="btnAnalysis" class="btn-slate" disabled>Xử lý nguồn âm</button>
            <button id="fullscreenButton" class="btn-slate" onclick="toggleFullScreen()">Mở rộng</button>
        </div>

        <div class="channel-row">
            <div class="channel-card channel-a-indicator">
                <button id="btnStartA" class="btn-slate" disabled>Kênh A (Khóa)</button>
                <select id="micSelectA" style="color: #dc2626;">
                    <option value="">-- Kênh A: Chờ tải thiết bị --</option>
                </select>
            </div>
            <div class="channel-card channel-b-indicator" id="cardChannelB" style="display:none;">
                <button id="btnStartB" class="btn-slate" disabled>Kênh B (Khóa)</button>
                <select id="micSelectB" style="color: #2563eb;">
                    <option value="">-- Kênh B: Chờ tải thiết bị --</option>
                </select>
            </div>
        </div>

        <div class="info-panel" id="infoText">
            <span id="infoMessageText">Đang tải hệ thống phân tích...</span>
        </div>
    </div>
</div>

<canvas id="oscilloscope"></canvas>

<!-- MODAL PHÂN TÍCH MỨC CƯỜNG ĐỘ ÂM (MCĐ) -->
<div id="mcdModalOverlay" class="modal-overlay">
    <div id="mcdModal" class="modal-content" style="background: #ffffff; color: #0f172a;" onclick="event.stopPropagation()">
        <div class="modal-header" style="background: linear-gradient(90deg, #059669, #10b981);">
            <span>📊 Phân tích Mức Cường độ âm (MCĐ) & Khoảng cách Nguồn âm</span>
        </div>
        
        <div class="modal-controls" style="background: #f8fafc; border-bottom: 1px solid #e2e8f0; display:flex; gap:8px; align-items:center; justify-content:space-between;">
            <button class="btn-dark" onclick="closeMcdModal()" style="display:inline-flex; align-items:center; gap:4px;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg> Quay lại
            </button>
            <button class="btn-blue" onclick="calculateAvgDistance()" style="display:inline-flex; align-items:center; gap:4px;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v8M8 12h8"></path></svg> 📏 Tính khoảng cách nguồn âm (rA, rB)
            </button>
        </div>

        <div style="padding: 20px; overflow-y: auto; flex-grow: 1;">
            <div id="mcdReportTableContainer" style="background: #ffffff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
                <h3 style="margin-top: 0; color: #1e293b; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px;" id="mcdTableHeaderTitle">
                    📋 BẢNG THỐNG KÊ MỨC CƯỜNG ĐỘ ÂM THU ĐƯỢC
                </h3>
                
                <table style="width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px;">
                    <thead>
                        <tr style="background: #f1f5f9; text-align: left; color: #475569;">
                            <th style="padding: 10px; border: 1px solid #cbd5e1;">Thông số đo</th>
                            <th style="padding: 10px; border: 1px solid #cbd5e1;">Giá trị (dB)</th>
                            <th style="padding: 10px; border: 1px solid #cbd5e1;">Đánh giá ngưỡng an toàn</th>
                        </tr>
                    </thead>
                    <tbody id="mcdTableBody">
                    </tbody>
                </table>
            </div>

            <div id="distanceResultBox" style="display: none; margin-top: 16px; padding: 14px; background: #eff6ff; border: 1px solid #93c5fd; border-radius: 8px; color: #1e40af; font-weight: 600; line-height: 1.6;">
            </div>
        </div>
    </div>
</div>

<script>
    // Logic tính toán khoảng cách được tối ưu & hoàn chỉnh
    function calculateAvgDistance() {
        const mode = getActiveChannelMode();
        const box = document.getElementById('distanceResultBox');
        box.style.display = 'block';

        const r0 = 1.0, L0 = 90.0; // Chuẩn mốc đo 1m tại 90 dB

        if (mode === '2') {
            if (dbHistoryA.length === 0 || dbHistoryB.length === 0) {
                box.innerHTML = "<span style='color:#dc2626;'>⚠️ Chưa đủ dữ liệu đo ở cả 2 kênh A và B! Vui lòng bật đo để ghi nhận tín hiệu.</span>";
                return;
            }

            let avgDbA = dbHistoryA.reduce((sum, item) => sum + item.db, 0) / dbHistoryA.length;
            let avgDbB = dbHistoryB.reduce((sum, item) => sum + item.db, 0) / dbHistoryB.length;
            
            let rA = r0 * Math.pow(10, (L0 - avgDbA) / 20);
            let rB = r0 * Math.pow(10, (L0 - avgDbB) / 20);
            let deltaR = Math.abs(rA - rB);
            let ratio = Math.pow(10, (avgDbA - avgDbB) / 20);

            box.innerHTML = `
                <div style="font-size: 14.5px;">
                    🎯 <b>KẾT QUẢ TÍNH KHOẢNG CÁCH NGUỒN ÂM (KÊNH A & B):</b><br>
                    • MCĐ Kênh A (L<sub>A</sub>): <b>${avgDbA.toFixed(1)} dB</b> ➔ Khoảng cách r<sub>A</sub> ≈ <span style="color:#dc2626; font-size:16px; font-weight:bold;">${rA.toFixed(2)} m</span><br>
                    • MCĐ Kênh B (L<sub>B</sub>): <b>${avgDbB.toFixed(1)} dB</b> ➔ Khoảng cách r<sub>B</sub> ≈ <span style="color:#2563eb; font-size:16px; font-weight:bold;">${rB.toFixed(2)} m</span><br>
                    • <b>Độ lệch khoảng cách:</b> Δr = |r<sub>A</sub> - r<sub>B</sub>| ≈ <span style="color:#059669; font-size:16px; font-weight:bold;">${deltaR.toFixed(2)} m</span><br>
                    • <b>Tỷ số khoảng cách:</b> r<sub>B</sub> / r<sub>A</sub> = 10<sup>(L<sub>A</sub> - L<sub>B</sub>)/20</sup> ≈ <span style="color:#8b5cf6; font-size:16px; font-weight:bold;">${ratio.toFixed(3)}</span> lần
                </div>
            `;
        } else {
            if (dbHistoryA.length === 0) {
                box.innerHTML = "<span style='color:#dc2626;'>⚠️ Chưa có dữ liệu đo cường độ âm ở Kênh A!</span>";
                return;
            }
            let avgDb = dbHistoryA.reduce((sum, item) => sum + item.db, 0) / dbHistoryA.length;
            let rDist = r0 * Math.pow(10, (L0 - avgDb) / 20);

            box.innerHTML = `
                <div style="font-size: 14.5px;">
                    🎯 <b>KẾT QUẢ TÍNH KHOẢNG CÁCH NGUỒN ÂM (KÊNH A):</b><br>
                    • MCĐ Trung bình (L<sub>tb</sub>): <b>${avgDb.toFixed(1)} dB</b><br>
                    • Khoảng cách ước tính từ nguồn âm: <span style="font-size: 17px; color: #dc2626; font-weight: bold;">r ≈ ${rDist.toFixed(2)} m</span>
                </div>
            `;
        }
    }

    function openMcdModal() {
        const overlay = document.getElementById('mcdModalOverlay');
        overlay.style.display = 'flex';
        document.getElementById('distanceResultBox').style.display = 'none';

        const mode = getActiveChannelMode();
        const tbody = document.getElementById('mcdTableBody');
        const SAFETY_THRESHOLD_DB = 85.0;

        if (mode === '2') {
            let calDbA = dbHistoryA.map(h => h.db);
            let calDbB = dbHistoryB.map(h => h.db);

            let avgA = calDbA.length > 0 ? (calDbA.reduce((a, b) => a + b, 0) / calDbA.length) : 0;
            let avgB = calDbB.length > 0 ? (calDbB.reduce((a, b) => a + b, 0) / calDbB.length) : 0;
            let maxA = calDbA.length > 0 ? Math.max(...calDbA) : 0;
            let maxB = calDbB.length > 0 ? Math.max(...calDbB) : 0;

            tbody.innerHTML = `
                <tr>
                    <td style="padding: 10px; border: 1px solid #cbd5e1; font-weight: bold; color: #dc2626;">Kênh A (Vị trí 1)</td>
                    <td style="padding: 10px; border: 1px solid #cbd5e1; font-weight: bold;">${avgA.toFixed(1)} dB (L<sub>max</sub>: ${maxA.toFixed(1)} dB)</td>
                    <td style="padding: 10px; border: 1px solid #cbd5e1; color: ${avgA > SAFETY_THRESHOLD_DB ? '#dc2626' : '#059669'}; font-weight: bold;">
                        ${avgA > SAFETY_THRESHOLD_DB ? '⚠️ CẢNH BÁO Ô NHIỄM TIẾNG ỒN' : '✅ Đạt chuẩn môi trường'}
                    </td>
                </tr>
                <tr>
                    <td style="padding: 10px; border: 1px solid #cbd5e1; font-weight: bold; color: #2563eb;">Kênh B (Vị trí 2)</td>
                    <td style="padding: 10px; border: 1px solid #cbd5e1; font-weight: bold;">${avgB.toFixed(1)} dB (L<sub>max</sub>: ${maxB.toFixed(1)} dB)</td>
                    <td style="padding: 10px; border: 1px solid #cbd5e1; color: ${avgB > SAFETY_THRESHOLD_DB ? '#dc2626' : '#059669'}; font-weight: bold;">
                        ${avgB > SAFETY_THRESHOLD_DB ? '⚠️ CẢNH BÁO Ô NHIỄM TIẾNG ỒN' : '✅ Đạt chuẩn môi trường'}
                    </td>
                </tr>
                <tr>
                    <td style="padding: 10px; border: 1px solid #cbd5e1; font-weight: bold;">Chênh lệch (ΔL = L<sub>A</sub> - L<sub>B</sub>)</td>
                    <td style="padding: 10px; border: 1px solid #cbd5e1; font-weight: bold; color: #8b5cf6;">${(avgA - avgB).toFixed(1)} dB</td>
                    <td style="padding: 10px; border: 1px solid #cbd5e1; color: #059669; font-weight: bold;">Dùng để tính tỷ số khoảng cách rB/rA</td>
                </tr>
            `;
        } else {
            let calDbValues = dbHistoryA.map(h => h.db);
            let maxDb = calDbValues.length > 0 ? Math.max(...calDbValues) : 0;
            let minDb = calDbValues.length > 0 ? Math.min(...calDbValues) : 0;
            let avgDb = calDbValues.length > 0 ? (calDbValues.reduce((a, b) => a + b, 0) / calDbValues.length) : 0;

            tbody.innerHTML = `
                <tr>
                    <td style="padding: 10px; border: 1px solid #cbd5e1;">Mức cường độ âm Lớn nhất (L<sub>max</sub>)</td>
                    <td style="padding: 10px; border: 1px solid #cbd5e1; font-weight: bold; color: ${maxDb > SAFETY_THRESHOLD_DB ? '#dc2626' : '#0f172a'};">${maxDb.toFixed(1)} dB</td>
                    <td style="padding: 10px; border: 1px solid #cbd5e1; color: ${maxDb > SAFETY_THRESHOLD_DB ? '#dc2626' : '#059669'}; font-weight: bold;">
                        ${maxDb > SAFETY_THRESHOLD_DB ? `⚠️ VƯỢT NGƯỠNG AN TOÀN (>${SAFETY_THRESHOLD_DB} dB)` : '✅ An toàn thính giác'}
                    </td>
                </tr>
                <tr>
                    <td style="padding: 10px; border: 1px solid #cbd5e1;">Mức cường độ âm Nhỏ nhất (L<sub>min</sub>)</td>
                    <td style="padding: 10px; border: 1px solid #cbd5e1; font-weight: bold;">${minDb.toFixed(1)} dB</td>
                    <td style="padding: 10px; border: 1px solid #cbd5e1; color: #059669; font-weight: bold;">✅ Bình thường</td>
                </tr>
                <tr>
                    <td style="padding: 10px; border: 1px solid #cbd5e1;">Mức cường độ âm Trung bình (L<sub>tb</sub>)</td>
                    <td style="padding: 10px; border: 1px solid #cbd5e1; font-weight: bold; color: ${avgDb > SAFETY_THRESHOLD_DB ? '#dc2626' : '#0f172a'};">${avgDb.toFixed(1)} dB</td>
                    <td style="padding: 10px; border: 1px solid #cbd5e1; color: ${avgDb > SAFETY_THRESHOLD_DB ? '#dc2626' : '#059669'}; font-weight: bold;">
                        ${avgDb > SAFETY_THRESHOLD_DB ? '⚠️ CẢNH BÁO Ô NHIỄM TIẾNG ỒN' : '✅ Đạt chuẩn môi trường'}
                    </td>
                </tr>
            `;
        }
    }

    function closeMcdModal() {
        const overlay = document.getElementById('mcdModalOverlay');
        if (overlay) overlay.style.display = 'none';
    }
</script>
</body>
</html>
